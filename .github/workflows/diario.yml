# Ciclo diario: capturar cuotas, emitir tickets, liquidar lo vencido y publicar.
#
# Tres detalles que no son cosméticos:
#
# 1. El LIBRO de tickets vive EN EL REPOSITORIO (papel/libro/tickets.jsonl) y el
#    workflow hace commit de vuelta. Antes vivía en una caché de Actions, que
#    caduca a los 7 días sin uso: dos semanas de parada y se perdía el historial
#    entero, que es lo único capaz de validar el sistema. En el repo es duradero,
#    versionado y auditable — cada emisión queda fechada en un commit.
#
# 2. La liquidación va DESPUÉS de emitir, porque resuelve tickets de días
#    anteriores: los partidos de hoy todavía no han terminado.
#
# 3. `--hasta` NO se fija: build.py deduce la temporada en curso de la fecha. Si
#    se dejara escrito un año, en agosto el modelo dejaría de ver los partidos
#    más recientes y los equipos recién ascendidos no existirían para él, sin
#    ningún síntoma visible.
name: Tickets diarios

on:
  schedule:
    # 11:00 UTC = 06:00 en Colombia. Antes de los partidos europeos de la tarde.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      cuota_objetivo:
        description: "Cuota combinada objetivo"
        default: "50"
      tickets:
        description: "Número de tickets"
        default: "5"

permissions:
  contents: write      # para hacer commit del libro de tickets
  pages: write
  id-token: write

concurrency:
  group: tickets-diarios
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install --quiet -r requirements.txt

      - name: Reconstruir el almacén de partidos
        run: |
          cd matchdata
          python build.py --ligas E0 E1 SP1 I1 D1 F1 N1 P1 \
            --desde 2019-20 --hasta 2025-26 --informe reports/build.json

      - name: Capturar cuotas de Betplay
        working-directory: betplay
        run: python capturar.py --max-eventos ${{ vars.MAX_EVENTOS || 140 }}

      - name: Emitir los tickets del día
        working-directory: model
        run: |
          python selector.py \
            --cuota-objetivo ${{ github.event.inputs.cuota_objetivo || 50 }} \
            --tickets ${{ github.event.inputs.tickets || 5 }}

      - name: Anotar en el libro
        working-directory: papel
        run: python registro.py anotar

      # `continue-on-error` porque liquidar depende de un servicio externo y de
      # un secreto: si falla, los tickets de HOY siguen siendo validos y deben
      # publicarse igual. Sin esto, un token caducado tumbaba el workflow entero
      # y no salia nada, ni siquiera lo que no dependia de el.
      #
      # El fallo no se esconde: el paso queda en amarillo en la pestana Actions,
      # y en la web el contador de "pendientes de resolver" crece mientras
      # "liquidados" no se mueve. Si ves eso, mira aqui.
      - name: Liquidar los tickets vencidos
        id: liquidar
        continue-on-error: true
        working-directory: papel
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python registro.py liquidar

      - name: Generar imágenes y sitio
        run: |
          cd papel && python imagen.py && cd ..
          cd web && python generar_sitio.py --salida ../_sitio
          cp -r ../papel/tickets_png ../_sitio/ 2>/dev/null || true

      # El commit del libro es lo que hace que el historial sobreviva a la
      # ejecución. `[skip ci]` evita que este commit dispare otro workflow.
      - name: Guardar el libro en el repositorio
        if: always()
        run: |
          git config user.name "crisbet-bot"
          git config user.email "actions@github.com"
          git add papel/libro/tickets.jsonl
          if git diff --cached --quiet; then
            echo "El libro no cambió: nada que commitear."
          else
            git commit -m "Libro de tickets: $(date -u +%Y-%m-%d) [skip ci]"
            # Otra corrida pudo empujar entretanto: se rebasa antes de empujar.
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi

      - name: Copia de seguridad del libro
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libro-tickets
          path: papel/libro/tickets.jsonl
          retention-days: 90

      - name: Avisar si la liquidación falló
        if: steps.liquidar.outcome == 'failure'
        run: |
          echo "::warning title=Liquidación fallida::Los tickets nuevos se publican, pero el historial NO se actualiza. Revisa el secreto FOOTBALL_DATA_TOKEN en Settings > Secrets and variables > Actions."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
